name: CD — Docker to Azure Container Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Set these in your GitHub repository secrets and variables:
  #   ACR_LOGIN_SERVER   — e.g. myregistry.azurecr.io
  #   ACR_USERNAME       — service principal / admin username
  #   ACR_PASSWORD       — service principal / admin password (secret)
  #   AZURE_WEBAPP_NAME  — Azure Web App name (if using App Service for Containers)
  IMAGE_NAME: blogit-web
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build Docker image and push to ACR
    runs-on: ubuntu-latest
    # Only run CD after CI passes
    needs: []

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: BlogIt.Web/Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: redeploy the Azure Web App for Containers after push.
      # Uncomment and configure if you're using Azure App Service.
      # - name: Deploy to Azure Web App
      #   uses: azure/webapps-deploy@v3
      #   with:
      #     app-name: ${{ vars.AZURE_WEBAPP_NAME }}
      #     images: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
