name: CI — Build & Test

# Web/server side of the product. The MAUI admin is built by ci-maui.yml instead: it needs
# the maui-android workload, which costs minutes this job should not pay on every change.
# BlogIt.Contracts is shared, so it triggers both workflows.
on:
  push:
    branches: [main]
    paths:
      - "src/BlogIt/**"
      - "src/BlogIt.Admin/**"
      - "src/BlogIt.AzureStorage/**"
      - "src/BlogIt.GoogleAnalytics/**"
      - "src/BlogIt.OpenAi/**"
      - "src/BlogIt.Contracts/**"
      - "samples/**"
      - "tests/BlogIt.Tests.Web/**"
      - "tests/BlogIt.Tests.Shared/**"
      - "build/**"
      - "BlogIt.slnx"
      - "BlogIt.Web.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/BlogIt/**"
      - "src/BlogIt.Admin/**"
      - "src/BlogIt.AzureStorage/**"
      - "src/BlogIt.GoogleAnalytics/**"
      - "src/BlogIt.OpenAi/**"
      - "src/BlogIt.Contracts/**"
      - "samples/**"
      - "tests/BlogIt.Tests.Web/**"
      - "tests/BlogIt.Tests.Shared/**"
      - "build/**"
      - "BlogIt.slnx"
      - "BlogIt.Web.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore dependencies
        run: dotnet restore BlogIt.Web.slnx --property:Configuration=Release

      - name: Build solution
        run: dotnet build BlogIt.Web.slnx --no-restore --configuration Release

      - name: Run shared tests
        run: >-
          dotnet test tests/BlogIt.Tests.Shared/BlogIt.Tests.Shared.csproj
          --no-build
          --no-restore
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results-shared.trx"
          --results-directory artifacts/test-results

      - name: Run web tests
        run: >-
          dotnet test tests/BlogIt.Tests.Web/BlogIt.Tests.Web.csproj
          --no-build
          --no-restore
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results-web.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 7
