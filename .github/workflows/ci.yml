name: CI — Build & Test

# Web/server side of the product. The MAUI admin is built by ci-maui.yml instead: it needs
# the maui-android workload, which costs minutes this job should not pay on every change.
# BlogIt.Contracts is shared, so it triggers both workflows.
on:
  push:
    branches: [main]
    paths:
      - "src/BlogIt.Core/**"
      - "src/BlogIt.Contracts/**"
      - "src/admin/BlogIt.Admin/**"
      - "src/providers/**"
      - "samples/**"
      - "tests/BlogIt.Tests/**"
      - "tests/BlogIt.Contracts.Tests/**"
      - "tests/PackageLayout/**"
      - "build/**"
      - "BlogIt.slnx"
      - "BlogIt.Web.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/BlogIt.Core/**"
      - "src/BlogIt.Contracts/**"
      - "src/admin/BlogIt.Admin/**"
      - "src/providers/**"
      - "samples/**"
      - "tests/BlogIt.Tests/**"
      - "tests/BlogIt.Contracts.Tests/**"
      - "tests/PackageLayout/**"
      - "build/**"
      - "BlogIt.slnx"
      - "BlogIt.Web.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore dependencies
        run: dotnet restore BlogIt.Web.slnx --property:Configuration=Release

      - name: Build solution
        run: dotnet build BlogIt.Web.slnx --no-restore --configuration Release

      - name: Run contracts tests
        run: >-
          dotnet test tests/BlogIt.Contracts.Tests/BlogIt.Contracts.Tests.csproj
          --no-build
          --no-restore
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results-contracts.trx"
          --results-directory artifacts/test-results

      - name: Run engine and admin tests
        run: >-
          dotnet test tests/BlogIt.Tests/BlogIt.Tests.csproj
          --no-build
          --no-restore
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results-web.trx"
          --results-directory artifacts/test-results

      # The integration suite again, on real SQLite files with the shipped BlogIt.Sqlite migrations
      # instead of EF's in-memory provider. In-memory enforces no foreign keys, raises the wrong
      # exception for a duplicate key and compares text ordinally, so passing there says little about
      # a relational database. Unit tests are skipped: they build their own contexts and would only
      # repeat the run above.
      - name: Run integration tests on SQLite
        env:
          BLOGIT_TEST_DATABASE: sqlite
        run: >-
          dotnet test tests/BlogIt.Tests/BlogIt.Tests.csproj
          --no-build
          --no-restore
          --configuration Release
          --verbosity normal
          --filter "FullyQualifiedName~BlogIt.Tests.Integration"
          --logger "trx;LogFileName=test-results-web-sqlite.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 7
