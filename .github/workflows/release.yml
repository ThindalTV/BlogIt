name: Release NuGet packages

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Pack and publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      # Set NUGET_SOURCE as a repository variable for GitHub Packages or a private feed.
      # It defaults to NuGet.org. NUGET_SYMBOL_SOURCE is optional and defaults to
      # NUGET_SOURCE. Store API keys in NUGET_API_KEY and, optionally,
      # NUGET_SYMBOL_API_KEY repository secrets. Set the optional NUGET_USERNAME
      # variable for feeds using basic authentication. GitHub Packages defaults the
      # username to the repository owner and can use GITHUB_TOKEN.
      NUGET_SOURCE: ${{ vars.NUGET_SOURCE || 'https://api.nuget.org/v3/index.json' }}
      NUGET_SYMBOL_SOURCE: ${{ vars.NUGET_SYMBOL_SOURCE }}
      NUGET_USERNAME: ${{ vars.NUGET_USERNAME }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      NUGET_SYMBOL_API_KEY: ${{ secrets.NUGET_SYMBOL_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      PACKAGE_FEED: ${{ github.workspace }}/artifacts/packages

    steps:
      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve package version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch "^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$") {
            throw "Release tag '$tag' is not of the form vMAJOR.MINOR.PATCH[-prerelease][+build]."
          }
          $version = $Matches.version
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Publishing package version $version"

      - name: Restore dependencies
        run: dotnet restore BlogIt.Web.slnx --property:Configuration=Release

      - name: Build solution
        # The web solution, not the full one: none of the published packages come from the MAUI
        # client, and building it here would need the maui-android workload.
        run: dotnet build BlogIt.Web.slnx --no-restore --configuration Release

      - name: Pack packages
        shell: pwsh
        run: |
          New-Item $env:PACKAGE_FEED -ItemType Directory -Force | Out-Null

          # BlogIt.Contracts is packed in its own right rather than carried inside BlogIt: the
          # engine package's lib folder deliberately excludes BlogIt.Contracts.dll, so an engine
          # published without it would have a dependency that cannot be resolved from the feed.
          $projects = @(
            "src/BlogIt/BlogIt.csproj",
            "src/BlogIt.Contracts/BlogIt.Contracts.csproj",
            "src/BlogIt.AzureStorage/BlogIt.AzureStorage.csproj",
            "src/BlogIt.OpenAi/BlogIt.OpenAi.csproj",
            "src/BlogIt.GoogleAnalytics/BlogIt.GoogleAnalytics.csproj"
          )
          foreach ($project in $projects) {
            dotnet pack $project `
              --configuration Release `
              --no-restore `
              --output $env:PACKAGE_FEED `
              "-p:PackageVersion=$env:PACKAGE_VERSION"
            if ($LASTEXITCODE -ne 0) { throw "Packing $project failed." }
          }

      - name: Validate package layout
        # Cheap, container-free half of the old package validation: asserts the packed layout and
        # that a clean consumer restores only what it should. Kept because it catches packaging
        # mistakes that are invisible until someone installs the release.
        shell: pwsh
        run: >-
          ./build/package-layout-tests/verify.ps1
          -PackageVersion $env:PACKAGE_VERSION
          -PackageFeed $env:PACKAGE_FEED
          -SkipPack

      - name: Publish packages
        shell: pwsh
        run: |
          $source = $env:NUGET_SOURCE.Trim()
          if ([string]::IsNullOrWhiteSpace($source)) {
            throw "NUGET_SOURCE must not be empty."
          }

          $apiKey = $env:NUGET_API_KEY
          if ([string]::IsNullOrWhiteSpace($apiKey) -and
              $source -match "^https://nuget\.pkg\.github\.com/") {
            $apiKey = $env:GITHUB_TOKEN
          }
          if ([string]::IsNullOrWhiteSpace($apiKey)) {
            throw "Set the NUGET_API_KEY repository secret for the configured NUGET_SOURCE."
          }

          $username = $env:NUGET_USERNAME
          if ([string]::IsNullOrWhiteSpace($username) -and
              $source -match "^https://nuget\.pkg\.github\.com/") {
            $username = $env:GITHUB_REPOSITORY_OWNER
          }

          $pushSource = $source
          if (-not [string]::IsNullOrWhiteSpace($username)) {
            & dotnet nuget add source $source `
              --name blogit-release `
              --username $username `
              --password $apiKey `
              --store-password-in-clear-text
            if ($LASTEXITCODE -ne 0) {
              throw "Configuring authenticated NuGet source failed with exit code $LASTEXITCODE."
            }
            $pushSource = "blogit-release"
          }

          $packages = @(
            Get-ChildItem artifacts/packages -File |
              Where-Object Extension -EQ ".nupkg" |
              Sort-Object Name
          )
          foreach ($package in $packages) {
            $arguments = @(
              "nuget", "push", $package.FullName,
              "--source", $pushSource,
              "--api-key", $apiKey,
              "--skip-duplicate"
            )

            $symbolPath = [IO.Path]::ChangeExtension($package.FullName, ".snupkg")
            if (Test-Path $symbolPath -PathType Leaf) {
              $symbolSource = if ([string]::IsNullOrWhiteSpace($env:NUGET_SYMBOL_SOURCE)) {
                $pushSource
              } else {
                $env:NUGET_SYMBOL_SOURCE.Trim()
              }
              $symbolApiKey = if ([string]::IsNullOrWhiteSpace($env:NUGET_SYMBOL_API_KEY)) {
                $apiKey
              } else {
                $env:NUGET_SYMBOL_API_KEY
              }
              $arguments += @(
                "--symbol-source", $symbolSource,
                "--symbol-api-key", $symbolApiKey
              )
            } else {
              $arguments += "--no-symbols"
            }

            & dotnet @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Publishing $($package.Name) failed with exit code $LASTEXITCODE."
            }
          }
